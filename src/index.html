<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ryan" />
    <meta name="keywords" content="Spots, HTML, CSS" />
    <meta name="description" content="Spots" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <img
          class="header__logo"
          src="<%=require('./images/logo.svg')%>"
          alt="Spots logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button type="button" class="profile__avatar-btn">
              <img
                src="<%=require('./images/editiconwhite.svg')%>"
                alt="Avatar picture"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Avatar picture"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/edit-icon.svg')%>"
                alt="Edit icon"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__new-post-btn">
            <img src="<%=require('./images/plus-icon.svg')%>" alt="Edit icon" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__delete-btn"></button>
                <img class="card__image" src="#" alt="" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__author">2025 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img src="<%=require('./images/x-icon.svg')%>" alt="Close Button" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                required
                id="profile-name-input"
                placeholder="Type your name"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                required
                id="profile-description-input"
                placeholder="Describe yourself"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img src="<%=require('./images/x-icon.svg')%>" alt="Close button" />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                required
                id="card-image-input"
                placeholder="Place a link to the picture"
                type="url"
                class="modal__input"
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="card-description-input" class="modal__label">
              Description
              <input
                required
                id="card-description-input"
                placeholder="Type your caption"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="30"
              />
              <span
                id="card-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
          >
            <img
              src="<%=require('./images/modal_image-closebtn.svg')%>"
              alt="Close button"
              class="modal__close-btn modal__close-btn_type_preview"
            />
          </button>
          <img src="#" alt="User Image" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img src="<%=require('./images/x-icon.svg')%>" alt="Close Button" />
          </button>
          <h2 class="modal__title">Edit Avatar</h2>
          <form class="modal__form" novalidate>
            <label for="profile-avatar-input" class="modal__label"
              >Avatar
              <input
                required
                id="profile-avatar-input"
                placeholder="Avatar goes here"
                class="modal__input"
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="delete-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/deletemodalclosebtn')%>"
              alt="Close Button"
            />
          </button>
          <h2 class="modal__title">
            Are you sure you want to delete this image?
          </h2>
          <form class="modal__form" id="delete-form" novalidate>
            <button type="submit" class="modal__submit-btn">Delete</button>
            <button type="button" class="modal__cancel-btn">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
